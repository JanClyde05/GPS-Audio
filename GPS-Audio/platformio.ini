; =============================================================================
; GuardianTrack — PlatformIO Configuration
; =============================================================================
; Two build environments:
;   pio run -e wearable    → builds wearable firmware
;   pio run -e receiver    → builds receiver firmware
;
; Upload:
;   pio run -e wearable -t upload
;   pio run -e receiver -t upload
;
; Upload captive portal files to receiver LittleFS:
;   pio run -e receiver -t uploadfs
; =============================================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; ── Wearable (body-worn: GPS + mic + button + ESP-NOW TX) ──────────────────

[env:wearable]
board = lolin_s3_mini
build_src_filter = +<../wearable/>
lib_deps =
  mikalhart/TinyGPSPlus@^1.1.0
  mathertel/OneButton@^2.5.0
build_flags =
  -I../shared
  -DMIC_SOURCE=MIC_SOURCE_I2S_DIGITAL
  -DBOARD_HAS_PSRAM
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

; ── Receiver (fixed base: WiFi STA + ESP-NOW RX + HTTPS upload) ────────────

[env:receiver]
board = lolin_s3_mini
build_src_filter = +<../receiver/>
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  me-no-dev/ESPAsyncWebServer@^1.2.4
  me-no-dev/AsyncTCP@^1.1.1
build_flags =
  -I../shared
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
